<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zeex AI — AI Vision Pipeline Demo</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#ffffff; --text:#07121a; --cyan: #00e5ff; --panel-bg: rgba(7,18,26,0.95); --panel-border: rgba(0,229,255,0.15); --panel-text:#e8f7ff }
    html,body{height:100%;margin:0;font-family:Barlow,system-ui,Segoe UI,Roboto,Arial; background:var(--bg); color:var(--text)}
    .scene { height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center }
    .wrap{ width:1000px; max-width:calc(100% - 48px); height:80vh; display:flex; align-items:center; justify-content:space-between; position:relative }

    /* Columns */
    .col { box-sizing:border-box }
    .col.left{ width:380px; height:320px }
    .col.center{ width:300px; height:320px; display:flex; align-items:center; justify-content:center; position:relative }
    .col.right{ width:300px; height:480px }

    /* Panel common */
    .panel { background:var(--panel-bg); border:1px solid rgba(0,229,255,0.12); border-radius:14px; position:relative; overflow:hidden; color:var(--panel-text) }
    .panel.small{ padding:14px }

    /* Input panel */
    #inputPanel{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; position:relative }
    #inputLabel{ position:absolute; left:10px; top:8px; font-family:monospace; font-size:9px; color:rgba(0,229,255,0.6); letter-spacing:0.06em }
    .uploadSlot{ width:160px; height:160px; border-radius:100px; border:2px dashed rgba(0,229,255,0.14); display:flex; align-items:center; justify-content:center; flex-direction:column; cursor:pointer }
    .feedRow{ box-sizing:border-box }
    .miniFeed{ width:100%; display:flex; align-items:center; justify-content:center }
    .miniFeed .feedBox{ width:100%; height:140px; border-radius:10px }
    .feedRow .feedBox{ width:100%; height:130px }
    .feedBox{ width:120px; height:120px; border-radius:12px; background:rgba(2,8,16,0.6); border:2px dashed rgba(0,229,255,0.06); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; position:relative; box-shadow: inset 0 1px 0 rgba(255,255,255,0.02); padding:6px }
    .feedBox::after{ content:""; position:absolute; inset:-6px; border-radius:12px; pointer-events:none; background: transparent; filter:blur(0); opacity:0; transition:opacity 180ms ease, transform 180ms ease }
    .feedBox:hover::after{ opacity:0; transform:none }
    .feedBox.selected{ outline:1px solid rgba(0,229,255,0.06); box-shadow:none }
    .feedBox.selected::after{ opacity:0; box-shadow:none; animation:none }
    .feedBox img{ width:100%; height:100%; object-fit:cover; border-radius:8px }
    .feedBox .placeholder{ font-family:monospace; font-size:11px; color:rgba(255,255,255,0.5); text-align:center; padding:6px }
    .useBtn{ position:absolute; right:8px; bottom:8px; background:rgba(255,255,255,0.06); color:var(--panel-text); border:1px solid rgba(255,255,255,0.04); padding:4px 8px; border-radius:6px; font-family:monospace; font-size:11px; cursor:pointer }
    .useBtn.hidden{ display:none }
    
    .uploadSlot small{ display:block; margin-top:8px; font-size:12px; color:rgba(255,255,255,0.8) }
    #imgPreview{ position:absolute; inset:32px; object-fit:cover; width:calc(100% - 64px); height:calc(100% - 64px); opacity:0; transition:opacity .3s }
    #imgCanvas{ position:absolute; inset:32px; width:calc(100% - 64px); height:calc(100% - 64px); pointer-events:none }
    #inputPanel::after{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 6px); mix-blend-mode:overlay; opacity:0.06 }

    /* Camera center */
    #camWrap{ width:260px; height:200px; display:flex; align-items:center; justify-content:center; position:relative; z-index:5 }
    .rings{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none }
    .ring{ border-radius:50%; border:1px solid rgba(0,200,255,0.12); position:absolute }
    .r1{ width:220px; height:220px }
    .r2{ width:280px; height:280px }
    .r3{ width:340px; height:340px }
    @keyframes ringGlow{ 0%,100%{opacity:.12;filter:blur(0)} 50%{opacity:.35;} }
    .ring{ animation: ringGlow 3s ease-in-out infinite }
    .r1{ animation-delay:0s } .r2{ animation-delay:1s } .r3{ animation-delay:2s }

    /* Camera svg styling */
    #cameraSVG{ width:110px; height:80px }
    .scan-beam{ position:absolute; height:2px; top:50%; left:50%; transform-origin:left center; opacity:0; z-index:10 }
    .beam-left{ background:linear-gradient(270deg, rgba(0,229,255,0.95), transparent); transform-origin:right center }
    .beam-right{ background:linear-gradient(90deg, rgba(0,229,255,0.95), transparent); transform-origin:left center }
    .scan-brackets{ position:absolute; width:120px; height:90px; pointer-events:none }
    .bracket{ position:absolute; width:16px; height:16px; box-sizing:content-box }
    .bracket:before, .bracket:after{ content:""; position:absolute; background:rgba(0,200,255,0.5) }
    /* TL */
    .b-tl{ left:calc(50% - 60px); top:calc(50% - 45px) }
    .b-tr{ right:calc(50% - 60px); top:calc(50% - 45px) }
    .b-bl{ left:calc(50% - 60px); bottom:calc(50% - 45px) }
    .b-br{ right:calc(50% - 60px); bottom:calc(50% - 45px) }
    .bracket:before{ width:100%; height:2px; top:0; left:0 }
    .bracket:after{ width:2px; height:100%; top:0; left:0 }

    #camStatus{ position:absolute; bottom:-40px; font-family:monospace; font-size:10px; color:rgba(0,229,255,0.5); letter-spacing:0.12em }

    /* Dashboard */
    #dashHeader{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px }
    #dashHeader h4{ margin:0; font-family:Barlow Condensed, monospace; font-weight:800; font-size:13px }
    .pulse{ width:10px; height:10px; border-radius:50%; background:var(--cyan); box-shadow:none; animation:none }
    @keyframes pulse{ 0%{transform:scale(.9); opacity:.8} 50%{transform:scale(1.1); opacity:1} 100%{transform:scale(.9); opacity:.8} }

    #detectionsList{ padding:12px 14px; display:flex; flex-direction:column; gap:10px; overflow:hidden }
    .detCard{ background:rgba(0,20,40,0.8); border:1px solid rgba(0,229,255,0.15); border-radius:8px; padding:10px 12px; opacity:0 }
    .detRow{ display:flex; align-items:center; gap:8px; }
    .swatch{ width:12px; height:12px; border-radius:4px }
    .label{ font-family:Barlow Condensed; font-weight:700; font-size:13px }
    .conf{ font-family:monospace; font-size:12px; margin-left:auto }
    .confBar{ height:3px; background:linear-gradient(90deg,var(--cyan),#2a65e8); border-radius:3px; width:0 }
    .tags{ display:flex; gap:6px; margin-top:8px }
    .tag{ font-family:monospace; font-size:10px; padding:2px 6px; border:1px solid rgba(255,255,255,0.04); border-radius:6px }

    #statsBar{ position:absolute; bottom:12px; left:12px; right:12px; display:flex; gap:18px; justify-content:flex-start; opacity:0 }
    /* hide bottom stats text per request */
    #statsBar{ display:none !important }

    /* Dashboard panel: neutral (no glow) */
    #dashPanel{ position:relative; border-radius:14px }
    .stat{ display:flex; flex-direction:column }
    .stat .num{ font-family:Barlow Condensed; font-weight:800; font-size:20px; color:#fff }
    .stat .lbl{ font-family:monospace; font-size:8px; color:rgba(255,255,255,0.6) }

    /* Particles container */
    .particles{ position:absolute; inset:0; pointer-events:none; z-index:20 }
    .data-particle{ position:absolute; width:8px; height:8px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); opacity:0 }

    /* thumbnails */
    .thumbs{ position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:8px }
    .thumb{ width:38px; height:28px; border-radius:6px; border:1px solid rgba(255,255,255,0.06); overflow:hidden; cursor:pointer }

    /* utilities */
    .hidden{ display:none }
  </style>
</head>
<body>
  <section class="scene">
    <div class="wrap" id="sceneWrap">
      <div class="col left">
        <div class="panel" id="dashPanel" style="height:100%">
          <div id="dashHeader">
            <h4>DETECTION OUTPUT</h4>
            <div class="pulse" id="dashPulse"></div>
          </div>
          <div id="dashVideoContainer" style="padding:12px 14px; display:flex; align-items:center; justify-content:center;">
            <video id="dashOutput" controls playsinline preload="metadata" src="/assets/Dashboard.mp4" style="width:100%; height:auto; max-height:220px; background:#000; border-radius:8px; object-fit:contain;" data-mode="video">
              <source src="/assets/Dashboard.mp4" type="video/mp4">
            </video>
          </div>
          <div id="detectionsList" style="display:none"></div>
          <div id="statsBar">
            <div class="stat"><div class="num" id="statObjects">0</div><div class="lbl">OBJECTS</div></div>
            <div class="stat"><div class="num" id="statTime">0ms</div><div class="lbl">PROC TIME</div></div>
            <div class="stat"><div class="num" id="statAcc">0%</div><div class="lbl">ACCURACY</div></div>
          </div>
        </div>
      </div>

      <div class="col center">
        <div class="panel" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;"> 
          <div class="rings" aria-hidden>
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
          </div>
          <div id="camWrap">
            <div id="cameraHolder" style="position:relative; width:260px; height:200px; display:flex; align-items:center; justify-content:center;">
              <div id="camWrapInner" style="position:relative;">
                <!-- 3D Camera Model (Three.js) -->
                <div id="camera3d" style="width:260px; height:200px; display:flex; align-items:center; justify-content:center"></div>
              </div>
              <div class="scan-beam beam-left" id="beamLeft" style="left:calc(50% - 130px); width:0"></div>
              <div class="scan-beam beam-right" id="beamRight" style="left:50%; width:0"></div>
              <div class="scan-brackets">
                <div class="bracket b-tl"></div>
                <div class="bracket b-tr"></div>
                <div class="bracket b-bl"></div>
                <div class="bracket b-br"></div>
              </div>
              <div id="camStatus">STANDBY</div>
              <svg width="14" height="14" style="position:absolute; right:8px; bottom:8px"><circle id="camLed" cx="7" cy="7" r="6" fill="#00ff88"></circle></svg>
            </div>
          </div>
        </div>
      </div>

      <div class="col right">
        <div class="panel" id="inputPanel">
          <div id="inputLabel">INPUT FEED</div>
          <div class="feedRow" id="feedRow" style="display:flex; flex-direction:column; gap:12px; padding:12px;">
            <div class="feedBox" data-index="0" id="feedBox0"><span class="placeholder">DROP IMAGE<br>OR CLICK</span><button class="useBtn hidden" data-index="0">Use</button></div>
            <div class="feedBox" data-index="1" id="feedBox1"><span class="placeholder">DROP IMAGE<br>OR CLICK</span><button class="useBtn hidden" data-index="1">Use</button></div>
            <div class="feedBox" data-index="2" id="feedBox2"><span class="placeholder">DROP IMAGE<br>OR CLICK</span><button class="useBtn hidden" data-index="2">Use</button></div>
          </div>
          <div style="display:flex; align-items:center; gap:12px; padding:12px 12px 0 12px;">
            <div style="font-size:12px; color:rgba(255,255,255,0.7);">Selected feed: <span id="selectedFeedLabel">1</span></div>
          </div>
          <input id="fileInput" type="file" accept="image/*" class="hidden" />
          <img id="imgPreview" alt="preview" />
          <canvas id="imgCanvas"></canvas>
        </div>
      </div>

      <div class="particles" id="particles"></div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/loaders/GLTFLoader.js';

    // Initialize a 3D CCTV-style camera model inside #camera3d (full-size, responsive)
    (function(){
      const mount = document.getElementById('camera3d');
      if(!mount) return;
      const scene = new THREE.Scene();
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0); // transparent background
      mount.appendChild(renderer.domElement);

      const fov = 40;
      const camera = new THREE.PerspectiveCamera(fov, 1, 0.1, 100);
      camera.position.set(0, 1.0, 3.2);

      const dir = new THREE.DirectionalLight(0xffffff, 0.9);
      dir.position.set(5,10,7);
      scene.add(dir);
      scene.add(new THREE.AmbientLight(0xffffff, 0.45));

      // Build a simple CCTV camera model from primitives
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0e2229, metalness: 0.3, roughness: 0.35 });
      const accentMat = new THREE.MeshStandardMaterial({ color: 0x00bfe0, metalness: 0.1, roughness: 0.4, emissive:0x003344, emissiveIntensity:0.08 });
      const lensMat = new THREE.MeshPhysicalMaterial({ color: 0x1a5b86, metalness: 0.05, roughness: 0.05, clearcoat:0.6, reflectivity:0.6, ior:1.3 });

      const group = new THREE.Group();
      let modelToAnimate = group; // will point to loaded GLTF or procedural group

      // housing
      const housing = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.0, 1.0, 4,1,1), bodyMat);
      housing.position.set(0,0,0);
      housing.rotation.y = 0.03;
      group.add(housing);

      // small accent stripe
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.06, 1.02), accentMat);
      stripe.position.set(0, -0.28, 0);
      group.add(stripe);

      // mount arm
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.14, 0.5), bodyMat);
      arm.position.set(-1.35, -0.4, 0);
      arm.rotation.z = -0.28;
      group.add(arm);

      // barrel
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.95,32), bodyMat);
      barrel.rotation.z = Math.PI/2;
      barrel.position.set(1.0, 0, 0);
      group.add(barrel);

      // lens glass
      const lens = new THREE.Mesh(new THREE.SphereGeometry(0.33,32,16), lensMat);
      lens.position.set(1.45, 0, 0);
      group.add(lens);

      scene.add(group);

      // Attempt to load a GLTF model from public assets; fall back to procedural group if unavailable
      try{
        const loader = new GLTFLoader();
        loader.load('/assets/surveillance-cctv-camera/source/surveillance_camera.glb', function(gltf){
          try{ scene.remove(group); }catch(e){}
          const loaded = gltf.scene || (gltf.scenes && gltf.scenes[0]);
          if(loaded){
            // compute bounding box and scale to fit the view
            const box = new THREE.Box3().setFromObject(loaded);
            const size = new THREE.Vector3(); box.getSize(size);
            const center = new THREE.Vector3(); box.getCenter(center);
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const desired = 1.8; // target size in scene units
            const s = desired / maxDim;
            loaded.scale.setScalar(s);
            // center the model
            loaded.position.sub(center.multiplyScalar(s));
            scene.add(loaded);
            modelToAnimate = loaded;
            // adjust camera to frame the model
            camera.position.set(0, Math.max(0.6, size.y*s), Math.max(1.8, maxDim*s*1.6));
            camera.lookAt(new THREE.Vector3(0,0,0));
          }
        }, undefined, function(err){
          console.warn('GLTF load failed, using procedural model', err);
        });
      }catch(e){ console.warn('GLTF loader not available', e); }

      // Controls: enable rotate-on-drag, no pan/zoom
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enablePan = false; controls.enableZoom = false; controls.enableRotate = true;
      controls.autoRotate = false; controls.autoRotateSpeed = 0.6; controls.enableDamping = true; controls.dampingFactor = 0.08;

      // make sure the DOM wrapper has perspective so rotateY is visible
      const camWrapEl = document.getElementById('camWrap');
      if(camWrapEl){ camWrapEl.style.transformStyle = 'preserve-3d'; camWrapEl.style.perspective = camWrapEl.style.perspective || '900px'; }

      let time = 0;
      function onResize(){
        const rect = mount.getBoundingClientRect();
        const w = Math.max(64, Math.floor(rect.width));
        const h = Math.max(48, Math.floor(rect.height));
        renderer.setSize(w, h);
        camera.aspect = w / h; camera.updateProjectionMatrix();
      }
      window.addEventListener('resize', onResize);
      onResize();

      function animate(){
        time += 0.01;
        // small motion for liveliness (only x-axis so we don't overwrite y-axis facing)
        if(modelToAnimate){
          modelToAnimate.rotation.x = Math.sin(time * 0.35) * 0.02;
        }
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
      // expose a helper to set model facing direction from page scripts
      const radToDeg = 180 / Math.PI;
      window.setModelFacing = function(dir, opts = {}){
        // dir: 'right' (inputs), 'left' (output), or 'center'
        let target = 0;
        if(dir === 'right') target = 0.7; // Turn towards right (inputs)
        else if(dir === 'left') target = -0.7; // Turn towards left (output)
        else target = 0;
        return new Promise((resolve)=>{
          if(!modelToAnimate) { console.log('setModelFacing: no modelToAnimate'); return resolve(); }
          console.log('setModelFacing ->', dir, target);
          gsap.to(modelToAnimate.rotation, { y: target, duration: opts.duration || 0.8, ease: 'power2.out', onComplete: ()=>{
            // ensure DOM wrapper mirrors rotation for visual consistency
            try{ if(camWrapEl) camWrapEl.style.transform = `rotateY(${(target*radToDeg).toFixed(2)}deg)`; }catch(e){}
            resolve();
          }});
        });
      };
    })();
  </script>
  <script>
    (function(){
      const sceneWrap = document.getElementById('sceneWrap');
      const fileInput = document.getElementById('fileInput');
      const imgPreview = document.getElementById('imgPreview');
      const imgCanvas = document.getElementById('imgCanvas');
      const feedBoxes = [document.getElementById('feedBox0'), document.getElementById('feedBox1'), document.getElementById('feedBox2')];
      let selectedFeedIndex = 0;
      const selectedFeedLabel = document.getElementById('selectedFeedLabel');
      // feed boxes have placeholders in markup; do not clear them here

      feedBoxes.forEach((fb, i) => {
        if(!fb) return;
        if(i === selectedFeedIndex) fb.classList.add('selected');
        fb.addEventListener('click', () => {
          feedBoxes.forEach(x => x.classList.remove('selected'));
          fb.classList.add('selected');
          selectedFeedIndex = i;
          selectedFeedLabel.textContent = (i+1).toString();
          // open file picker to upload into this selected feed box
          fileInput.click();
        });
      });
      const inputPanel = document.getElementById('inputPanel');
      const camWrap = document.getElementById('camWrap');
      const camLed = document.getElementById('camLed');
      const camStatus = document.getElementById('camStatus');
      const beamLeft = document.getElementById('beamLeft');
      const beamRight = document.getElementById('beamRight');
      const particles = document.getElementById('particles');
      const detectionsList = document.getElementById('detectionsList');
      const statsBar = document.getElementById('statsBar');

      const scenes = [
        { // Traffic Jam
          detections:[{label:'VEHICLE CLUSTER',conf:97,color:'#ff6b35',tags:['DENSITY:HIGH','ZONE:A4','COUNT:47']},{label:'ROAD BLOCKAGE',conf:89,color:'#ff3355',tags:['SEVERITY:3','LANE:2-4','ALERT:ON']},{label:'SIGNAL TIMING',conf:94,color:'#00e5ff',tags:['PHASE:RED','DELAY:+42s','ADAPTIVE']}], stats:['47','124ms','97%']
        },{
          detections:[{label:'COLLISION DETECTED',conf:99,color:'#ff1744',tags:['SEVERITY:CRITICAL','VEHICLES:2','911:NOTIFIED']},{label:'INJURED PERSON',conf:82,color:'#ff6d00',tags:['STATUS:ASSESS','EMS:3min']},{label:'LANE CLOSURE',conf:95,color:'#ffea00',tags:['LANES:1-2','REROUTE:ON']}], stats:['3','98ms','99%']
        },{
          detections:[{label:'AMBULANCE',conf:99,color:'#00e676',tags:['SIREN:ACTIVE','PRIORITY:1']},{label:'GREEN CORRIDOR',conf:96,color:'#00e5ff',tags:['SIGNALS:8','CLEARED:6']},{label:'VEHICLE YIELD',conf:88,color:'#ffea00',tags:['COUNT:12','COMPLIANT:11']}], stats:['8','87ms','99%']
        },{
          detections:[{label:'CROWD DENSITY',conf:93,color:'#aa00ff',tags:['COUNT:~340','DENSITY:MED']},{label:'ANOMALY DETECTED',conf:76,color:'#ff3355',tags:['TRACK:ON','ALERT:MONITOR']},{label:'FLOW DIRECTION',conf:91,color:'#00e5ff',tags:['DIR:NE','SPEED:1.2m/s']}], stats:['340','156ms','93%']
        }
      ];

      let sceneIdx = 0;
      let tl;
      // when true, automatic ingest loop controls camera facing and timeline
      let autoMode = true;

      function clearDetections(){ detectionsList.innerHTML=''; statsBar.style.opacity=0 }

      function resetAll(){
        gsap.killTweensOf('*');
        document.querySelectorAll('.data-particle').forEach(n=>n.remove());
        const ctx = imgCanvas.getContext('2d'); if(ctx) ctx.clearRect(0,0,imgCanvas.width,imgCanvas.height);
        imgPreview.style.opacity=0; imgPreview.src=''; imgPreview.removeAttribute('data-ready');
        camStatus.textContent='STANDBY'; camLed.setAttribute('fill','#00ff88');
        beamLeft.style.width='0px'; beamLeft.style.opacity=0; beamRight.style.width='0px'; beamRight.style.opacity=0;
        clearDetections();
      }

      function createThumbs(){
        const thumbs = document.getElementById('thumbs'); thumbs.innerHTML='';
        scenes.forEach((s,i)=>{
          const b=document.createElement('div'); b.className='thumb'; b.title='Scene '+i; b.dataset.idx=i; b.addEventListener('click',()=>{ startCycle(i); }); thumbs.appendChild(b);
        });
      }

      function fitCanvasToImage(img){
        const rect = img.getBoundingClientRect(); imgCanvas.width = rect.width; imgCanvas.height = rect.height; imgCanvas.style.left = rect.left - inputPanel.getBoundingClientRect().left + 'px'; imgCanvas.style.top = rect.top - inputPanel.getBoundingClientRect().top + 'px'; imgCanvas.style.position='absolute';
      }

      function drawBoxes(dets){
        // Disabled: remove colored overlay boxes and labels per user request.
        const ctx = imgCanvas.getContext('2d'); if(!ctx) return;
        ctx.clearRect(0,0,imgCanvas.width,imgCanvas.height);
        return;
      }

      function spawnParticles(n, fromRect, toRect, onComplete){
        const created=[];
        for(let i=0;i<n;i++){
          const p = document.createElement('div'); p.className='data-particle'; p.style.left=(fromRect.left + fromRect.width/2)+'px'; p.style.top=(fromRect.top + fromRect.height/2)+'px'; p.style.opacity=0; particles.appendChild(p); created.push(p);
          const endX = toRect.left + 10 + Math.random()*10; const endY = toRect.top + (Math.random()-0.5)*60 + toRect.height/2;
          gsap.fromTo(p, {opacity:0, x:0, y:0, scale:1}, {opacity:1, x: endX - (fromRect.left + fromRect.width/2), y: endY - (fromRect.top + fromRect.height/2), duration: 0.6 + Math.random()*0.2, ease:'power2.in', delay: i*0.08, onComplete: ()=>{ gsap.to(p, {scale:2.5, opacity:0, duration:0.36, onComplete: ()=>p.remove()}) }});
        }
        if(onComplete) gsap.delayedCall(0.9 + n*0.08, onComplete);
      }

      function animateScene(idx){
        if(autoMode) return; // skip manual scene animation when autoMode active
        resetAll(); clearDetections();
        const scene = scenes[idx];
        // show preview if not present: use placeholder demo image
        if(!imgPreview.src) imgPreview.src = '/assets/traffic.jpg';
        imgPreview.style.filter = 'hue-rotate(160deg) saturate(1.5) brightness(1.1)';
        fitCanvasToImage(imgPreview);

        tl = gsap.timeline({ onComplete: ()=>{ gsap.delayedCall(3, ()=>startCycle((idx+1)%4)); } });

        // Phase 1
        tl.to(imgPreview, {opacity:1, x:0, duration:0.5, ease:'power2.out'}, 0);

        // Phase 2 camera scans
        tl.add(()=>{ camStatus.textContent='SCANNING'; camLed.setAttribute('fill','#ffaa00'); }, 0.5);
        tl.to('#camWrap', {rotationY:-25, duration:0.5, transformOrigin:'50% 50%'}, 0.5);
        tl.to(beamLeft, {width:200, opacity:1, duration:0.4}, 0.5);

        // Particles input->camera
        tl.add(()=>{
          const srcBox = (feedBoxes[selectedFeedIndex] || feedBoxes[0]);
          const inputRect = srcBox.getBoundingClientRect(); const camRect = camWrap.getBoundingClientRect(); spawnParticles(6, inputRect, camRect);
        }, 0.8);

        // Camera processes
        tl.add(()=>{ gsap.to(beamLeft, {opacity:0, duration:0.2}); gsap.to('#camWrap', {rotationY:0, scale:1.1, duration:0.15, yoyo:true, repeat:1}); camStatus.textContent='PROCESSING\u00B7\u00B7\u00B7'; camLed.setAttribute('fill','#ff4400'); }, 1.8);
        tl.add(()=>{ drawBoxes(scene.detections); }, 1.9);

        // Transmit
        tl.add(()=>{ camStatus.textContent='TRANSMITTING\u00B7\u00B7\u00B7'; camLed.setAttribute('fill','#00e5ff'); }, 2.8);
        tl.to('#camWrap', {rotationY:25, duration:0.5}, 2.8);
        tl.to(beamRight, {width:200, opacity:1, duration:0.4}, 2.8);

        // Particles cam->dashboard
        tl.add(()=>{ const camRect = camWrap.getBoundingClientRect(); const dashCont = document.getElementById('dashVideoContainer'); const dashRect = dashCont ? dashCont.getBoundingClientRect() : document.querySelector('.col.left .panel').getBoundingClientRect(); spawnParticles(8, camRect, dashRect); }, 3.1);

        // Dashboard reveals
        tl.add(()=>{
          gsap.to(beamRight, {opacity:0, duration:0.25}); gsap.to('#camWrap', {rotationY:0, duration:0.3}); camLed.setAttribute('fill','#00ff88'); camStatus.textContent='COMPLETE ✓';
          // inject cards
          // If dashboard is set to video mode (for user-supplied output), skip injecting demo detection cards
          const dashVideo = document.getElementById('dashOutput');
          if (!dashVideo || dashVideo.dataset.mode !== 'video') {
            scene.detections.forEach((d,i)=>{
              const card=document.createElement('div'); card.className='detCard'; card.innerHTML=`<div class='detRow'><div class='label'>${d.label}</div><div class='conf'>${d.conf}%</div></div>`; detectionsList.appendChild(card);
              gsap.to(card, {opacity:1, x:0, duration:0.4, ease:'power2.out', delay:i*0.35});
            });
          } else {
            // video mode: keep container empty for user video; ensure detectionsList hidden
            detectionsList.style.display = 'none';
          }
          // stats
          gsap.to(statsBar, {opacity:1, duration:0.6, delay:0.6});
          document.getElementById('statObjects').textContent = scene.stats[0]; document.getElementById('statTime').textContent = scene.stats[1]; document.getElementById('statAcc').textContent = scene.stats[2];
        }, 3.8);

      }

      function startCycle(idx){ sceneIdx = idx||0; animateScene(sceneIdx); }

      // File upload — each feed box opens file picker on click
      fileInput.addEventListener('change', (e)=>{
        const f = e.target.files[0]; if(!f) return; const reader=new FileReader(); reader.onload=(ev)=>{
          // set thumbnail into selected feed box
          const dataUrl = ev.target.result;
          const targetBox = feedBoxes[selectedFeedIndex];
          if(targetBox){
            // remove placeholder if present
            const ph = targetBox.querySelector('.placeholder'); if(ph) ph.remove();
            // remove previous img if any
            const prev = targetBox.querySelector('img'); if(prev) prev.remove();
            const thumb = document.createElement('img'); thumb.src = dataUrl; targetBox.appendChild(thumb);
            // reveal the 'Use' button for this feed
            const btn = targetBox.querySelector('.useBtn'); if(btn) btn.classList.remove('hidden');
          }
          // do not auto-set main preview; user must click 'Use' on a feed to load it
        }; reader.readAsDataURL(f);
      });

      // Output side toggling removed per user request

      // wire per-feed 'Use' buttons
      feedBoxes.forEach((fb, i) => {
        const btn = fb ? fb.querySelector('.useBtn') : null;
        if(btn) btn.addEventListener('click', (ev)=>{
          ev.stopPropagation();
          const img = fb.querySelector('img');
          if(img){ imgPreview.src = img.src; imgPreview.onload = ()=>{ fitCanvasToImage(imgPreview); startCycle(0); } }
        });
      });

      // init
      // prefill feed boxes with the requested logo image for automated ingestion
      const logoPath = '/assets/Zeex-AI%20logo%20.png';
      feedBoxes.forEach((fb,i)=>{
        if(!fb) return;
        const ph = fb.querySelector('.placeholder'); if(ph) ph.remove();
        const prev = fb.querySelector('img'); if(prev) prev.remove();
        const thumb = document.createElement('img'); thumb.src = logoPath; thumb.style.opacity = '1'; thumb.onload = ()=>{}; fb.appendChild(thumb);
        const btn = fb.querySelector('.useBtn'); if(btn) btn.classList.add('hidden');
      });
      createThumbs();

      // helper sleep
      function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

      // ingest three inputs, face output, autoplay video, repeat
      async function runAutoCycle(){
        const dashVideo = document.getElementById('dashOutput');
        const radToDeg = 180 / Math.PI;
        async function faceTo(dir, duration = 0.8){
          const degMap = { right: 35, left: -35, center: 0 };
          const camDeg = degMap[dir] ?? 0;
          const p1 = (typeof window.setModelFacing === 'function') ? window.setModelFacing(dir, { duration }) : Promise.resolve();
          const p2 = new Promise(res=> gsap.to('#camWrap', { rotationY: camDeg, duration, ease:'power2.out', onComplete: res }));
          await Promise.all([p1, p2]);
        }
        while(true){
          // face inputs (right)
          await faceTo('right', 0.7);
          camStatus.textContent = 'INGESTING...';

          // sequentially ingest three images
          for(let i=0;i<feedBoxes.length;i++){
            const fb = feedBoxes[i]; if(!fb) continue;
            const img = fb.querySelector('img'); if(!img) continue;
            const fromRect = fb.getBoundingClientRect(); const camRect = camWrap.getBoundingClientRect();
            spawnParticles(8, fromRect, camRect);
            // animate thumbnail into camera (fade out)
            gsap.to(img, {opacity:0, scale:0.9, duration:0.6, ease:'power2.in'});
            await sleep(900);
            // remove thumbnail to simulate ingestion
            if(img && img.parentNode) img.parentNode.removeChild(img);
            await sleep(200);
          }

          // all inputs processed -> face output (left)
          camStatus.textContent = 'SENDING TO OUTPUT...';
          await faceTo('left', 0.7);
          camStatus.textContent = 'COMPLETE ✓';

          // autoplay dashboard video only when facing output
          if(dashVideo){
            try{
              dashVideo.muted = true; // allow autoplay
              await dashVideo.play();
            }catch(e){ console.warn('Video play failed', e); }
            await new Promise(res=>{ dashVideo.onended = ()=>{ res(); }; });
            // reset video state
            dashVideo.pause(); dashVideo.currentTime = 0; dashVideo.muted = false;
          } else {
            // no video: pause briefly
            await sleep(1800);
          }

          // face inputs again and refill thumbnails for next cycle
          await faceTo('right', 0.7);
          camStatus.textContent = 'RELOAD INPUTS';
          // re-add thumbnails
          feedBoxes.forEach((fb)=>{
            if(!fb) return;
            const prev = fb.querySelector('img'); if(prev) prev.remove();
            const thumb = document.createElement('img'); thumb.src = logoPath; thumb.style.opacity='1'; fb.appendChild(thumb);
          });
          await sleep(800);
        }
      }

      // start automatic loop once the Three module exposes setModelFacing
      (async function startWhenReady(){
        const waitFor = async (checkFn, ms = 100, attempts = 50) => {
          for(let i=0;i<attempts;i++){
            if(checkFn()) return true;
            await new Promise(r=>setTimeout(r, ms));
          }
          return false;
        };
        const ready = await waitFor(()=> typeof window.setModelFacing === 'function', 100, 60);
        if(!ready) console.warn('setModelFacing did not become available; proceeding without facing control');
        try{ runAutoCycle(); }catch(e){ console.error('runAutoCycle error', e); }
      })();
      window.addEventListener('resize', ()=>{ if(imgPreview.src) fitCanvasToImage(imgPreview); });

    })();
  </script>
</body>
